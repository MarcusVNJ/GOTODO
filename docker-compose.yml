services:
  postgres:
    image: postgres:16.4-alpine
    container_name: todo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_gotodo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: todo_api
    ports:
      - "7001:7001"
    environment:
      ENVIRONMENT: development
      PORT: "7001"
      DATABASE_URL: postgres://postgres:root@postgres:5432/todo_db?sslmode=disable
      ENABLE_DOCS: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_gotodo:
